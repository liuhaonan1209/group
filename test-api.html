<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body>
    <h1>Bus Management System API Test</h1>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        // Test route API
        async function testRouteAPI() {
            try {
                const response = await axios.get('http://localhost:8890/api/route/list?page=1&size=10');
                results.innerHTML += '<h3>Route API Test:</h3><pre>' + JSON.stringify(response.data, null, 2) + '</pre>';
            } catch (error) {
                results.innerHTML += '<h3>Route API Test (Error):</h3><pre>' + error.message + '</pre>';
            }
        }
        
        // Test finance API
        async function testFinanceAPI() {
            try {
                const response = await axios.get('http://localhost:8895/api/finance/balance?page=1&size=10');
                results.innerHTML += '<h3>Finance API Test:</h3><pre>' + JSON.stringify(response.data, null, 2) + '</pre>';
            } catch (error) {
                results.innerHTML += '<h3>Finance API Test (Error):</h3><pre>' + error.message + '</pre>';
            }
        }
        
        // Run tests
        testRouteAPI();
        testFinanceAPI();
    </script>
</body>
</html>
